        unit: { type: string }
        quantity: { type: integer, minimum: 1 }
        soCuon:
          type: ["integer", "null"]
        soKi:
          type: ["integer", "null"]
        unitPrice: { $ref: "#/components/schemas/MoneyVnd" }
        costPrice: { $ref: "#/components/schemas/MoneyVnd" }
        effectiveQuantity: { type: integer, minimum: 1 }
        saleSubtotal: { $ref: "#/components/schemas/MoneyVnd" }
        cogs: { $ref: "#/components/schemas/MoneyVnd" }
        isManual: { type: boolean }
    ContactSnapshot:
