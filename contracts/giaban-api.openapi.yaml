        archived: { type: boolean }
        revision: { type: integer, minimum: 1 }
        duplicatePhoneWarning: { type: boolean }
    MaskedCustomerPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
