components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: GiabanSessionOrMcpToken
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 500 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, minLength: 8, maxLength: 128 }
    ExpectedRevision:
      name: If-Match-Revision
      in: header
      schema: { type: integer, minimum: 1 }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string }
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: { type: string }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string }
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: { type: string }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string }
    BackupId:
      name: backupId
      in: path
      required: true
      schema: { type: string }
    FromDate:
      name: fromDate
      in: query
      required: true
      schema: { type: string, format: date }
    ToDate:
      name: toDate
      in: query
      required: true
      schema: { type: string, format: date }
    AsOfDate:
      name: asOfDate
      in: query
      schema: { type: string, format: date }
  responses:
    Error:
      description: Domain error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - REVISION_CONFLICT
        - IDEMPOTENCY_CONFLICT
        - INVALID_TRANSITION
        - CONFIRMATION_REQUIRED
        - CONFIRMATION_EXPIRED
        - CONFIRMATION_STALE
        - RATE_LIMITED
        - MIGRATION_READ_ONLY
        - INTERNAL_ERROR
    Error:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
        retryable: { type: boolean }
        nextAction: { type: string }
        details:
          type: object
          additionalProperties: true
    MoneyVnd:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    Scope:
      type: string
      enum:
        - catalog:read
        - catalog:write
        - customers:read
        - customers:pii:read
        - customers:write
        - customers:merge
        - orders:read
        - orders:write
        - orders:lifecycle
        - orders:cancel
        - payments:read
        - payments:write
        - payments:reverse
        - payments:refund
        - transactions:read
        - transactions:write
        - transactions:reverse
        - reports:read
        - settings:read
        - settings:write
        - backups:export
        - backups:import
        - backups:restore
        - audit:read
    OrderStatus:
      type: string
      enum: [draft, confirmed, shipping, completed, cancelled, discarded]
    CashType:
      type: string
      enum: [income, expense]
    PageMeta:
      type: object
      additionalProperties: false
      required: [hasMore, limit]
      properties:
        hasMore: { type: boolean }
        nextCursor:
          type: ["string", "null"]
        limit: { type: integer, minimum: 1, maximum: 100 }
    StatusView:
      type: object
      additionalProperties: false
      required: [ok, contractVersion, authoritativeStore, datasetGenerationId, writeFence, migrationReady, migrationBlockerCount, migrationBlockerSummary, mcpMutationsEnabled]
      properties:
        ok: { type: boolean }
        contractVersion: { type: string }
        authoritativeStore: { type: string, enum: [kv, d1] }
        datasetGenerationId: { type: string }
        writeFence: { type: boolean }
        migrationReady: { type: boolean }
        migrationBlockerCount: { type: integer, minimum: 0 }
        migrationBlockerSummary:
          type: array
          items: { $ref: "#/components/schemas/MigrationBlockerSummaryItem" }
        mcpMutationsEnabled: { type: boolean }
    MigrationBlockerSummaryItem:
      type: object
      additionalProperties: false
      required: [type, count]
      properties:
        type: { type: string }
        count: { type: integer, minimum: 1 }
    CapabilitiesView:
      type: object
      additionalProperties: false
      required: [contractVersion, operations, mcpTools, killSwitches]
      properties:
        contractVersion: { type: string }
        operations:
          type: array
          items: { type: string }
        mcpTools:
          type: array
          items: { type: string }
        killSwitches:
          type: object
          additionalProperties: false
          required: [mcpRead, mcpWrite, mcpChannel]
          properties:
            mcpRead: { type: boolean }
            mcpWrite: { type: boolean }
            mcpChannel: { type: boolean }
    PublicProductVariant:
      type: object
      additionalProperties: false
      required: [size, unit, price]
      properties:
        size: { type: string }
        unit: { type: string }
        price: { $ref: "#/components/schemas/MoneyVnd" }
    PublicProduct:
