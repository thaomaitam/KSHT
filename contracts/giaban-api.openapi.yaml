openapi: 3.1.0
info:
  title: Giaban API
  version: 1.0.0
  summary: Authoritative Giaban HTTP, RPC, and MCP boundary contract
  description: >
    Single machine-checkable contract for the Domain/API Worker, frontend, Service Binding,
    and MCP adapters. Adapters MUST NOT invent totals, identity, lifecycle, payment, PII,
    or authorization rules. Local $ref only.
  x-giaban-rpc:
    entrypoint: GiabanDomain
    method: invoke
    envelope: InvokeEnvelope
  x-giaban-limits:
    pageDefault: 50
    pageMax: 100
    confirmationTtlSeconds: 600
    idempotencyTtlSeconds: 86400
    internalAssertionTtlSeconds: 60
    businessTimezone: Asia/Ho_Chi_Minh
    mcpProtocolVersion: "2026-07-28"
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: system
  - name: public
  - name: catalog
  - name: customers
  - name: orders
  - name: payments
  - name: cash
  - name: reports
  - name: settings
  - name: backups
  - name: audit
paths:
  /status:
    get:
      operationId: getStatus
      tags: [system]
      x-giaban-mcp:
        tool: giaban_get_status
        annotations: { readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false }
      x-giaban-scopes: []
      responses:
        "200":
          description: Worker and dataset status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusView" }
        default: { $ref: "#/components/responses/Error" }
  /capabilities:
    get:
      operationId: getCapabilities
      tags: [system]
      x-giaban-mcp:
        tool: giaban_get_capabilities
        annotations: { readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false }
      x-giaban-scopes: []
      responses:
        "200":
          description: Enabled operations, kill switches, and contract version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilitiesView" }
        default: { $ref: "#/components/responses/Error" }
  /public/products:
    get:
      operationId: listPublicProducts
      tags: [public]
      security: []
      x-giaban-scopes: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: categoryId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Cost-free public catalog page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicProductPage" }
        default: { $ref: "#/components/responses/Error" }
  /public/products/{productId}:
    get:
      operationId: getPublicProduct
      tags: [public]
      security: []
      x-giaban-scopes: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Cost-free public product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicProduct" }
        default: { $ref: "#/components/responses/Error" }
  /public/categories:
    get:
      operationId: listPublicCategories
      tags: [public]
      security: []
      x-giaban-scopes: []
      responses:
        "200":
          description: Public categories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicCategoryPage" }
        default: { $ref: "#/components/responses/Error" }
  /public/settings:
    get:
      operationId: getPublicSettings
      tags: [public]
      security: []
      x-giaban-scopes: []
      responses:
        "200":
          description: Public-safe shop settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicSettings" }
        default: { $ref: "#/components/responses/Error" }
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      x-giaban-mcp:
        tool: giaban_list_products
        annotations: { readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false }
      x-giaban-scopes: [catalog:read]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: categoryId, in: query, schema: { type: string } }
        - { name: includeArchived, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Admin product page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProductPage" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createProduct
      tags: [catalog]
      x-giaban-mcp:
        tool: giaban_create_product
        annotations: { readOnlyHint: false, destructiveHint: false, idempotentHint: false, openWorldHint: false }
      x-giaban-scopes: [catalog:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
        default: { $ref: "#/components/responses/Error" }
  /products/{productId}:
    get:
      operationId: getProduct
      tags: [catalog]
      x-giaban-mcp:
        tool: giaban_get_product
        annotations: { readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false }
      x-giaban-scopes: [catalog:read]
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Admin product including cost
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProduct
      tags: [catalog]
      x-giaban-mcp:
        tool: giaban_update_product
        annotations: { readOnlyHint: false, destructiveHint: false, idempotentHint: false, openWorldHint: false }
      x-giaban-scopes: [catalog:write]
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/ExpectedRevision"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductWrite" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
        default: { $ref: "#/components/responses/Error" }
  /products/{productId}/archive:
    post:
      operationId: archiveProduct
      tags: [catalog]
      x-giaban-mcp:
        tool: giaban_archive_product
        annotations: { readOnlyHint: false, destructiveHint: true, idempotentHint: false, openWorldHint: false }
      x-giaban-scopes: [catalog:write]
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/ExpectedRevision"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
        default: { $ref: "#/components/responses/Error" }
  /products/{productId}/restore:
    post:
      operationId: restoreProduct
      tags: [catalog]
      x-giaban-mcp:
        tool: giaban_restore_product
        annotations: { readOnlyHint: false, destructiveHint: false, idempotentHint: false, openWorldHint: false }
      x-giaban-scopes: [catalog:write]
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/ExpectedRevision"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
        default: { $ref: "#/components/responses/Error" }
  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      x-giaban-mcp:
        tool: giaban_list_categories
