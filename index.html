<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giaban - Báo Giá Sản Phẩm</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['HarmonyOS Sans', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* HarmonyOS Sans Font */
        @font-face {
            font-family: 'HarmonyOS Sans';
            src: url('/fonts/HarmonyOS_Sans_Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: 'HarmonyOS Sans', 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #000;
        }

        /* Admin form inputs - Black text color */
        input,
        textarea,
        select {
            font-family: 'HarmonyOS Sans', 'Inter', sans-serif;
            color: #000 !important;
            -webkit-text-fill-color: #000;
        }

        input::placeholder,
        textarea::placeholder {
            color: #94a3b8 !important;
            -webkit-text-fill-color: #94a3b8;
            opacity: 1;
        }

        /* Ensure select dropdown text is black */
        select option {
            color: #000;
            font-family: 'HarmonyOS Sans', 'Inter', sans-serif;
        }

        /* Dark mode body */
        .dark body,
        html.dark body {
            background-color: #0f172a;
            color: #e2e8f0;
        }

        /* Custom scrollbar for modal */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
